# Fixed rules (SPEC §8.6; v3.0.0 step 1c S3, OD-500). ecf owns them: they run first, before the
# applied rules (or the default rules in starter_rules.yaml), and a rules file can't redefine
# them. Each reads ecf's fixed safety items; every clause on an item also reads the kept schema
# v2 values that say the same (sender_type regulator, person/friend/family; raise-only, P2).
version: 1
rules:
  - id: fraud_guard                      # 1
    when:
      or:
        - {field: fraud_risk, in: [medium, high]}
        - {field: bank_detail_change, eq: true}
        - and:                           # claims to be a colleague, from outside, about money
            - {field: claims_internal, eq: true}         # (OD-262)
            - {fact: sender_origin, eq: external}
            - or: [{field: payment_related, eq: true}, {fact: payment_keyword, eq: true}]
        - and: [{field: payment_related, eq: true}, {fact: auth_result, eq: fail}]
        - and:                           # impersonating someone internal, about money (OD-436);
            - {fact: impersonates_internal, eq: true}   # gift cards count here only (OD-457)
            - or:
                - {field: payment_related, eq: true}
                - {fact: payment_keyword, eq: true}
                - {fact: gift_card_keyword, eq: true}
        - and:                           # an executive-impersonation opener from outside, before
            - {fact: bec_opener, eq: true}               # any money is named (OD-479)
            - {fact: sender_origin, eq: external}
            - not: {fact: self_sent, eq: true}
        - and:                           # employee tax forms asked for from outside, no money
            - {fact: tax_form_request, eq: true}         # named: the W-2 scam (OD-482)
            - {fact: sender_origin, eq: external}
            - not: {fact: self_sent, eq: true}
        - {trigger: fraud}
    then: [{label: suspicious}, flag, escalate]
    actor: none
    hide: never

  - id: regulatory                       # 2: before fraud_weak and unverified_payment_sender, so
    when:                                # a regulator trigger always escalates (OD-253); the
      or:                                # item, its kept source, or the trigger (P1)
        - {field: regulator_claim, eq: true}
        - {field: sender_type, eq: regulator}
        - {trigger: regulator}
    then: [{label: regulatory}, flag, escalate]
    actor: none
    hide: never

  - id: fraud_weak                       # 3: first-time + payment, no second signal; or a lone
    when:                                # Reply-To mismatch on a payment item; or a claimed
      or:                                # colleague from outside with no money (OD-262)
        - {trigger: fraud_weak}
        - and: [{field: claims_internal, eq: true}, {fact: sender_origin, eq: external}]
        - {fact: impersonates_internal, eq: true}   # without money (OD-436)
        - and:                           # a private individual from outside about money: a
            - or:                        # colleague on a personal address the model can't place
                - {field: private_individual, eq: true}   # (OD-476; P2, step 1c P5)
                - {field: sender_type, in: [person, friend, family]}
            - {fact: sender_origin, eq: external}
            - or: [{field: payment_related, eq: true}, {fact: payment_keyword, eq: true}]
    then: [{label: suspicious}, flag]
    actor: none
    hide: never

  - id: unverified_payment_sender        # 4
    when:
      and:
        - {field: payment_related, eq: true}
        - {fact: auth_result, eq: none}
        - not: {fact: sender_verified, eq: true}  # `ecf sender set-verified` (OD-065)
        - not: {fact: self_sent, eq: true}  # Gmail: your own note to yourself (OD-446)
    then: [{label: unverified_sender}, flag]
    actor: none
    hide: never

  - id: spam_or_phishing                 # 5: before the default rules, so a phishing email
    when: {field: phishing, eq: true}    # answered as another category is still junked; id
                                         # and label kept in S3 (P16)
    then: [{label: spam_or_phishing}, junk]
