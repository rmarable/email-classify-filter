# Default rules (SPEC §8.6). ecf's fixed rules (fixed_rules.yaml: fraud_guard, regulatory,
# fraud_weak, unverified_payment_sender, spam_or_phishing) always run first; these follow them
# unless rules were applied (`ecf config apply`), which replace these, not the fixed ones (v3.0.0
# S3, OD-500). First match wins. On `high` addresses the policy layer turns the hide actions into
# label + leave (SPEC §8.3); that is not done here.
version: 1
rules:
  - id: bug_report                       # 3
    when: {field: category, eq: bug_report}
    then:
      - {label: bug_report}
      - {flag: true, if: {field: priority, gte: high}}
      - {escalate: true, if: {field: priority, eq: urgent}}
    actor: {continue_if: {field: requires_reply, eq: true}}

  - id: invoice                          # 4
    when: {field: category, eq: invoice}
    then:
      - {label: invoice}
      - {flag: true, if: {field: deadline_mentioned, eq: true}}
      - leave
    actor: {continue_if: {field: requires_reply, eq: true}}

  - id: payment_confirmation_remittance  # 5
    when: {field: category, in: [payment_confirmation, remittance]}
    then: [{label: {field: category}}]
    actor: {continue_if: {field: requires_reply, eq: true}}

  - id: account_security                 # 5a-5d: schema v2's personal categories (OD-475);
    when: {field: category, eq: account_security}   # none of them hides mail
    then: [{label: account_security}, flag]
    actor: {continue_if: {field: requires_reply, eq: true}}

  - id: shipping                         # 5b
    when: {field: category, eq: shipping}
    then: [{label: shipping}, leave]
    actor: {continue_if: {field: requires_reply, eq: true}}

  - id: appointment_school_family        # 5c
    when: {field: category, in: [appointment, school_or_family]}
    then:
      - {label: {field: category}}
      - {flag: true, if: {field: deadline_mentioned, eq: true}}
    actor: {continue_if: {field: requires_reply, eq: true}}

  - id: travel_finance                   # 5d
    when: {field: category, in: [travel, finance]}
    then: [{label: {field: category}}]
    actor: {continue_if: {field: requires_reply, eq: true}}

  - id: marketing                        # 7
    when:
      and: [{field: category, eq: marketing}, {field: requires_action, eq: false}]
    then: [{label: marketing}, archive]

  - id: automated_notification           # 8
    when:
      and:
        - {field: category, eq: notification}
        - {field: sender_type, eq: automated}
        - {field: requires_action, eq: false}
    then: [{label: notification}, mark_read, archive]

  - id: requires_reply                   # 9
    when: {field: requires_reply, eq: true}
    then: [{label: {field: category}}, flag]
    actor: continue

  - id: otherwise                        # 10
    actor: continue
