# Trigger keyword lists (SPEC §8.5), versioned with each release. Reviewed by the operator on
# 2026-09-29.
#
# Matching (OD-063): whole words. `acronyms` are case-sensitive, `phrases` case-insensitive; both
# are compared after folding (NFKC, format characters removed, UTS #39 skeleton), so lookalike
# letters still match. Words in a phrase may be separated by any run of whitespace.
version: 1

# Bank details. Alone they never trigger (OD-060): they need a first-time sender (human-confirmed
# only, OD-044), change wording, or a Reply-To mismatch. Bare `bank`, `banking` and `wire` were
# removed: "bank holiday" and "wire" in newsletters escalated as fraud (operator decision
# 2026-09-29, OD-202).
bank:
  acronyms: [IBAN, SWIFT, BIC, ACH, ABA]
  phrases:
    - bank account
    - bank details
    - banking details
    - account number
    - routing number
    - sort code
    - wire transfer
    - wiring instructions
    - remittance details

# Wording that says payment details changed (OD-060, OD-061).
change:
  acronyms: []
  phrases:
    - new account
    - new bank
    - new banking details
    - updated bank details
    - updated banking details
    - update our bank details
    - changed our bank
    - change of bank
    - bank details have changed
    - change of remittance
    - new remittance
    - updated remittance
    - new payment details
    - updated payment details
    - new wiring instructions
    - update your records

# Money moving or owed (SPEC §6: payment keyword).
payment:
  acronyms: [ACH]
  phrases:
    - invoice
    - invoices
    - payment
    - payments
    - remittance
    - remit
    - wire transfer
    - bank transfer
    - balance due
    - amount due
    - past due
    - overdue
    - outstanding balance
    - direct deposit
    - purchase order
    - please pay
    - pay now

# Gift cards (V1.6, OD-436, OD-457): money only for the impersonation rules. As payment keywords
# they marked every ordinary gift-card email suspicious (eval: 4 of 4; closing run: 1 of 1) and
# changed no fraud decision, so they count only when the mail impersonates someone internal.
gift_card:
  phrases:
    - gift card
    - gift cards
    - giftcard
    - giftcards

# Openers of an executive-impersonation (BEC) scam (operator decision 2026-10-08, OD-479): the
# first message asks if you're free, for a quick discreet favour, by email only, with no money
# yet. One phrase alone is ordinary mail; the fact `bec_opener` needs two different phrases, and
# rule 1 escalates it only from an outside sender. Very common phrases on their own ("sent from
# my phone") are not listed.
bec_opener:
  phrases:
    - are you at your desk
    - are you available
    - are you around
    - quick favour
    - quick favor
    - small favour
    - small favor
    - handled discreetly
    - keep this between us
    - keep it between us
    - keep this confidential
    - in meetings all day
    - in a meeting all day
    - email only
    - can't take calls
    - cannot take calls
    - can't talk now
    - reply as soon as you see this

# Employee tax and payroll data (operator decision 2026-10-09, OD-482): the W-2 scam asks HR or
# finance to send every employee's tax form, with no money named. A form alone is ordinary mail
# (a payroll provider's "your W-2s are ready"), so the fact `tax_form_request` also needs a phrase
# from `data_request`, and rule 1 escalates it only from an outside sender. W-9 is not listed:
# customers and vendors ask for one routinely.
tax_form:
  phrases:
    - W-2
    - W-2s
    - W-2's
    - W2
    - W2s
    - employee tax forms
    - employees' tax forms
    - staff tax forms
    - employee tax documents
    - wage and tax statement
    - wage and tax statements
    - payroll records
    - payroll register
    - pay stubs
    - paystubs
    - payslips
    - pay slips

# Asking for documents to be sent to the writer (OD-482): with a `tax_form` phrase, the fact
# `tax_form_request`. Phrases that automated notices use ("reply to this email", "do not reply
# to this address") are not listed.
data_request:
  phrases:
    - send me
    - send them to me
    - send it to me
    - send them over
    - send them to this address
    - send it to this address
    - send them here
    - email me the
    - email them to me
    - forward them to me
    - forward me the
    - as one PDF
    - as a single PDF
    - in one PDF
    - in a single PDF
    - as one file
    - in one file
    - my personal email
    - my personal address

# Regulators and regulatory terms (SPEC §8.5: the regulator trigger). US federal agencies plus
# common terms; add state and non-US agencies as needed.
regulator:
  acronyms: [SEC, IRS, FTC, FDA, FINRA, CFPB, OSHA, EPA, FCC, DOJ, HMRC]
  phrases:
    - internal revenue service
    - securities and exchange commission
    - federal trade commission
    - food and drug administration
    - consumer financial protection bureau
    - department of labor
    - department of justice
    - department of revenue
    - attorney general
    - subpoena
    - civil investigative demand
    - notice of deficiency
    - regulatory inquiry
    - warning letter
    - cease and desist

# Text addressed to an automated reader (fraud trigger 10; operator decision 2026-10-01, OD-252).
# An email that tells the model what to conclude is an injection attempt: the fraud guard
# escalates it whatever the model then says. Only phrases that address the reader or give it an
# instruction; a bare "AI assistant" is common in ordinary product mail and is not listed.
# Paraphrases not listed here still reach the model (SPEC §8.5 limits).
injection:
  phrases:
    - note to the assistant
    - note for the assistant
    - note to the automated assistant
    - note for the automated assistant
    - note to the ai
    - note to the classifier
    - note to the email classifier
    - note for the email classifier
    - note to the automated reviewer
    - note for the automated reviewer
    - instructions for the assistant
    - assistant processing this mailbox
    - ignore all previous instructions
    - ignore previous instructions
    - ignore your previous instructions
    - disregard previous instructions
    - disregard all previous instructions
    - classify this email as
    - classify this message as
    - classify it as
    - rate fraud risk
    - set fraud risk
    - approved by the mailbox owner
    - nota para el asistente
    - system instruction
    - instruction from the system
    - instructions from the system
    - instruction for the email classifier
    - set category to
    - set the category to
