# Linux-only CI (free minutes). macOS tests run locally before merging to main (CLAUDE.md, merge gate).
name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.6", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: import-linter
        run: uv run lint-imports
      - name: tests (excluding macos)
        run: uv run pytest -m "not macos"

  licenses-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.6"
          enable-cache: true
      - run: uv sync --locked
      - name: license allow-list (runtime dependencies)
        run: uv run python scripts/check_licenses.py
      - name: THIRD_PARTY_NOTICES is current
        run: |
          uv run python scripts/check_licenses.py --notices
          git diff --exit-code -- THIRD_PARTY_NOTICES
      - name: build and hash
        run: |
          uv build -o dist
          sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
