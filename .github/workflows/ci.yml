# Linux-only CI (free minutes). macOS tests run locally before merging to main (CLAUDE.md, merge gate).
name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.6", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: import-linter
        run: uv run lint-imports
      - name: tests (excluding macos)
        run: uv run pytest -m "not macos"

  licenses-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.6"
          enable-cache: true
      - run: uv sync --locked
      - name: license allow-list (runtime dependencies)
        run: uv run python scripts/check_licenses.py
      # Reproducible build (SPEC §17.4, §1.5 item 6): two builds from this commit must match.
      - name: build twice and compare hashes
        run: |
          uv run python scripts/release_build.py --out "$RUNNER_TEMP/build-a"
          uv run python scripts/release_build.py --out "$RUNNER_TEMP/build-b"
          cmp "$RUNNER_TEMP/build-a/SHA256SUMS" "$RUNNER_TEMP/build-b/SHA256SUMS"
          cmp "$RUNNER_TEMP/build-a/release-manifest.json" "$RUNNER_TEMP/build-b/release-manifest.json"
          (cd "$RUNNER_TEMP/build-a" && sha256sum --check --strict SHA256SUMS)
          (cd "$RUNNER_TEMP/build-b" && sha256sum --check --strict SHA256SUMS)
          cat "$RUNNER_TEMP/build-a/SHA256SUMS" | tee -a "$GITHUB_STEP_SUMMARY"
