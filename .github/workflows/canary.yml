# The weekly model canary (SPEC §7.6; OD-053, OD-300): Anthropic's model deprecations page and
# models overview against models.lock (the Ollama tags-page check went in v3.0.0, ADR 0031).
# Scheduled runs use the default branch only; run it by hand from the Actions tab on any branch.
name: canary

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.15"

jobs:
  models:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-26.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.6"
          enable-cache: true
      - run: uv sync --locked
      - name: model canary
        run: uv run python scripts/model_canary.py
