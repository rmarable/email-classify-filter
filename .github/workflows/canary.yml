# The weekly model canary (SPEC §7.6; OD-053, OD-300): Anthropic's model deprecations page and
# models overview, and the Ollama library's tags page, against models.lock and ollama.lock.
# Scheduled runs use the default branch only; run it by hand from the Actions tab on any branch.
name: canary

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.15"

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12.6"
          enable-cache: true
      - run: uv sync --locked
      - name: model canary
        run: uv run python scripts/model_canary.py
