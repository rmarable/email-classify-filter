[project]
name = "email-classify-filter"
dynamic = ["version"]
description = "Watches business mailboxes, flags invoice and payment fraud, and asks a person to approve actions in Slack."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12.6"
authors = [{ name = "Rodney Marable" }]
dependencies = [
    "dkimpy[ed25519]>=1.1",
    "dnspython>=2.6",
    "httpx>=0.27",
    "imapclient>=3.0",
    "keyring>=25",
    "mcp==2.2.0",
    "pydantic>=2.8",
    "pynacl>=1.5",
    "pyobjc-framework-localauthentication>=12 ; sys_platform == 'darwin'",
    "pyobjc-framework-security>=10 ; sys_platform == 'darwin'",
    "pyrage>=1.4",
    "python-pam>=2.0 ; sys_platform == 'linux'",
    "ruamel-yaml>=0.18",
    "slack-sdk>=3.44",
    "starlette>=0.40",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
eval = [
    "reportlab>=4.2",
    "pillow>=10.4",
]

[project.scripts]
ecf = "ecf.cli:main"
ecf-mcp = "ecf.mcp_stdio:main"
ecf-server = "ecf_server.__main__:main"

[dependency-groups]
dev = [
    "email-classify-filter[eval]",
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "hypothesis>=6.100",
    "testcontainers>=4.8",
    "aiosmtpd>=1.4.6",
    "pytest-xdist>=3.8.0",
]

[build-system]
# Pinned so a rebuild of a tag gives the same bytes (scripts/release_build.py; SPEC §17.4).
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ecf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ecf", "src/ecf_server"]

[tool.hatch.build.targets.wheel.extra-metadata]
# Dependency license texts (SPEC §1.5 item 4), at .dist-info/extra_metadata/ in the wheel.
"THIRD_PARTY_NOTICES" = "THIRD_PARTY_NOTICES"

[tool.hatch.build.targets.sdist]
# An allow-list: hatch reads only this project's .gitignore, so untracked local folders (agent
# worktrees, test caches) were packaged before (V1.6 closing run, 2026-10-06).
# tests/test_sdist_contents.py checks it.
only-include = [
    "src", "tests", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "SPEC.md", "SECURITY.md",
    "CONTRIBUTING.md", "GENERATE-FAKE-TESTING-EMAILS.md", "pyproject.toml", "uv.lock",
    "build-constraints.txt",
    ".python-version", "THIRD_PARTY_NOTICES",
]
exclude = ["tests/eval/synthetic/.build/*"]  # built on demand, up to 66 MB each

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "T20"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S108", "S603", "S607"]
"scripts/**" = ["T201", "S603", "S607"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["docs"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "macos: needs macOS (Keychain, launchd, LocalAuthentication); run locally before merging to main",
    "linux_only: needs Linux (Secret Service, systemd, PAM)",
    "imap: needs a Docker socket for the Dovecot container (Colima on macOS; OD-186)",
]

[tool.importlinter]
root_packages = ["ecf", "ecf_server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The client (ecf) never imports the service (ecf_server)"
type = "forbidden"
source_modules = ["ecf"]
forbidden_modules = ["ecf_server"]

[[tool.importlinter.contracts]]
name = "The client (ecf) never imports Slack, LocalAuthentication or PAM (V1.2 security review)"
type = "forbidden"
source_modules = ["ecf"]
forbidden_modules = ["slack_sdk", "LocalAuthentication", "pam"]
