[project]
name = "email-classify-filter"
dynamic = ["version"]
description = "Watches business mailboxes, flags invoice and payment fraud, and asks a person to approve actions in Slack."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Rodney Marable" }]
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.8",
    "pyobjc-framework-security>=10 ; sys_platform == 'darwin'",
    "ruamel-yaml>=0.18",
    "starlette>=0.40",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
eval = [
    "reportlab>=4.2",
    "pillow>=10.4",
]

[project.scripts]
ecf = "ecf.cli:main"
ecf-mcp = "ecf.mcp_stdio:main"
ecf-server = "ecf_server.__main__:main"

[dependency-groups]
dev = [
    "email-classify-filter[eval]",
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ecf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ecf", "src/ecf_server"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "tests/eval/synthetic/.build/"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "T20"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S108", "S603"]
"scripts/**" = ["T201", "S603", "S607"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["docs"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "macos: needs macOS (Keychain, launchd, LocalAuthentication); run locally before merging to main",
    "linux_only: needs Linux (Secret Service, systemd, PAM)",
]

[tool.importlinter]
root_packages = ["ecf", "ecf_server"]

[[tool.importlinter.contracts]]
name = "The client (ecf) never imports the service (ecf_server)"
type = "forbidden"
source_modules = ["ecf"]
forbidden_modules = ["ecf_server"]
