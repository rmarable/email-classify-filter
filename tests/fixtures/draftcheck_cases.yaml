# The draft checker's specification (docs/roadmap/m8-model-written-drafts.md §1; SPEC §12.2 names
# this file at Step 11). Each case runs on its own: a draft, the email it answers (a name from
# `emails` or inline text), the email's links, the allowed addresses, and the codes the checker
# must refuse and warn with, exactly. `spans` gives, for each refuse code, text the code must
# have matched, so a case can't pass for the wrong reason.
#
# Rules (plan §1, AN3, AO6, AP4): entries are never deleted; a change is a new entry with
# `supersedes:` and its reason, and changing an expected refusal to a pass needs an OD row in SPEC
# in the same commit. Every code has a refuse case and a pass case marked `near_miss:` for it. A
# case without `email` uses `default`, which holds no bank word, payment noun, amount or pay verb.
#
# Two choices the plan leaves to the build (Step 3, 2026-10-27): when `characters` refuses, it is
# the only code reported (the other patterns can't be trusted on that text); and links and email
# addresses are masked before the word checks, so "pay" inside a URL isn't a pay verb.

version: 1
allowed: [pat@acme.example, me@vendor-a.example]

emails:
  default: {text: "Hello, could you let us know when the parts will be ready? Thanks, Pat"}
  account: {text: "Hello, my account manager asked me to check when the parts will be ready. Thanks, Pat"}
  payment: {text: "Hello, please pay invoice 7713 for €2,000 by Friday. Thanks, Pat"}
  deposit: {text: "Hello, have you sent the deposit yet? Thanks, Pat"}
  fee: {text: "Hello, have you paid the fee? Thanks, Pat"}
  invoice: {text: "Hello, I can't find last month's invoice. Thanks, Pat"}
  seats: {text: "Hello, this month's bill lists 30 seats, but we only have 24. Can you check? Thanks, Pat"}
  sortcode: {text: "Hello, our new details are sort code 20-10-27 / account 20251130. Thanks, Pat"}
  eur2099: {text: "Hello, the charge on our side is €20.99. Thanks, Pat"}
  eur2000c: {text: "Hello, the charge on our side is €20.00. Thanks, Pat"}
  eur2000: {text: "Hello, the €2,000 invoice is attached. Thanks, Pat"}
  units: {text: "Hello, we need 4,500 units by the end of the month. Thanks, Pat"}
  two_thousand: {text: "Hello, please send the €2,000 today. Thanks, Pat"}
  bait_invoice: {text: "URGENT: invoice 8812 for €4,200 is overdue. Pay today to avoid suspension of your service."}
  linked: {text: "Hello, your order is at https://acme.example/order/12 if you need it. Thanks, Pat", links: ["https://acme.example/order/12"]}

