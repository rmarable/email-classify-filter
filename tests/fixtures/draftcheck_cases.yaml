  - {id: chars-tab-inside, draft: "Thanks\tPat", refuse: [characters], spans: {characters: "\t"}, source: AI4}
  - {id: chars-tab-leading, draft: "\tThanks for your email.", near_miss: characters, source: AI4}
  - {id: chars-typographic, draft: "We’re “glad” it worked – thanks… Pat", near_miss: characters, source: AH1}
  - {id: chars-currency-signs, draft: "The fee is £20 or €20 — noted.", email: {text: "Hello, is the fee £20 or €20? Thanks, Pat"}, source: AH1}
  - {id: chars-accented, draft: "José wïll pây", refuse: [money], spans: {money: "pây"}, near_miss: characters, source: AJ7}
  - {id: chars-cyrillic, draft: "Спасибо", refuse: [characters], spans: {characters: "С"}, source: AI3}
  - {id: chars-pound-currency, draft: "That is ₤2000", refuse: [characters], spans: {characters: "₤"}, source: AN1}
