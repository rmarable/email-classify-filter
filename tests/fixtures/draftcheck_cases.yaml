  - {id: chars-nbsp, draft: "I will\u00a0pay soon", refuse: [characters], spans: {characters: "\u00a0"}, source: AH1}
  - {id: chars-figure-space, draft: "Account 44\u20077122", refuse: [characters], spans: {characters: "\u2007"}, source: AH1}
  - {id: chars-ideographic-space, draft: "We\u3000will pay", refuse: [characters], spans: {characters: "\u3000"}, source: AH1}
  - {id: chars-hangul-filler, draft: "I wㅤill pay", refuse: [characters], spans: {characters: "ㅤ"}, source: AH1}
  - {id: chars-hangul-filler-2, draft: "I wᅟill pay", refuse: [characters], spans: {characters: "ᅟ"}, source: AH1}
  - {id: chars-braille-blank, draft: "I w⠀ill pay", refuse: [characters], spans: {characters: "⠀"}, source: AH1}
  - {id: chars-object-replacement, draft: "Thanks￼ Pat", refuse: [characters], spans: {characters: "￼"}, source: AH1}
  - {id: chars-mark-mc, draft: "Thanks aः lot", refuse: [characters], spans: {characters: "ः"}, source: AH1}
  - {id: chars-mark-me, draft: "Thanks a⃝ lot", refuse: [characters], spans: {characters: "⃝"}, source: AH1}
  - {id: chars-line-separator, draft: "Thanks\u2028Pat", refuse: [characters], spans: {characters: "\u2028"}, source: AI1}
  - {id: chars-tab-inside, draft: "Thanks\tPat", refuse: [characters], spans: {characters: "\t"}, source: AI4}
  - {id: chars-tab-leading, draft: "\tThanks for your email.", near_miss: characters, source: AI4}
  - {id: chars-typographic, draft: "We’re “glad” it worked – thanks… Pat", near_miss: characters, source: AH1}
  - {id: chars-currency-signs, draft: "The fee is £20 or €20 — noted.", email: {text: "Hello, is the fee £20 or €20? Thanks, Pat"}, source: AH1}
  - {id: chars-accented, draft: "José wïll pây", refuse: [money], spans: {money: "pây"}, near_miss: characters, source: AJ7}
  - {id: chars-cyrillic, draft: "Спасибо", refuse: [characters], spans: {characters: "С"}, source: AI3}
  - {id: chars-pound-currency, draft: "That is ₤2000", refuse: [characters], spans: {characters: "₤"}, source: AN1}
  - {id: chars-middle-dot, draft: "Use 4471·2233·99", refuse: [characters], spans: {characters: "·"}, source: AO1}
  - {id: chars-dotless-i, draft: "We wıll pay", refuse: [characters], spans: {characters: "ı"}, source: AJ7}
  - {id: chars-dotted-capital-i, draft: "İ will pay", refuse: [characters], spans: {characters: "İ"}, source: AJ7}
  - {id: chars-long-s, draft: "The ſum is due", refuse: [characters], spans: {characters: "ſ"}, source: AJ7}
  - {id: chars-times, draft: "2 × 3", refuse: [characters], spans: {characters: "×"}, source: AI3}
  - {id: chars-divide, draft: "6 ÷ 3", refuse: [characters], spans: {characters: "÷"}, source: AI3}
  - {id: chars-eth-capital, draft: "Ðana", refuse: [characters], spans: {characters: "Ð"}, source: AI3}
  - {id: chars-thorn, draft: "Þanks", refuse: [characters], spans: {characters: "Þ"}, source: AI3}
  - {id: chars-sharp-s, draft: "Straße", refuse: [characters], spans: {characters: "ß"}, source: AI3}
  - {id: chars-eth, draft: "ðanks", refuse: [characters], spans: {characters: "ð"}, source: AI3}
  - {id: chars-kra, draft: "ĸind regards", refuse: [characters], spans: {characters: "ĸ"}, source: AI3}
  - {id: chars-l-dot-capital, draft: "Ŀater", refuse: [characters], spans: {characters: "Ŀ"}, source: AI3}
  - {id: chars-l-dot, draft: "ŀater", refuse: [characters], spans: {characters: "ŀ"}, source: AI3}
  - {id: chars-apostrophe-n, draft: "ŉot today", refuse: [characters], spans: {characters: "ŉ"}, source: AI3}
  - {id: chars-eng, draft: "Ŋice", refuse: [characters], spans: {characters: "Ŋ"}, source: AI3}

