# Benign replies for the draft checker's false-refusal measurement (M8 plan §1 "False positives",
# AW5, AX1). Each pair is an email and a polite reply that commits to nothing, written by intent
# before the checker code existed, so every expected verdict is pass. Step 3 counts the checker's
# refusals here (the 2% figure) and on `bait_style`, the safe replies to payment emails that look
# like bait (a stated cost the operator decides before the freeze, BW-M2). Tags say what each
# pair is there for: echo (repeats a fact from the email), soft (a soft timing line), ask (a
# question or request to the sender), payment (the email holds a payment term), short (a short
# email), non_ascii (the reply echoes non-ASCII text).
#
# Allowed addresses are the fixture file's: pat@acme.example (the sender) and me@vendor-a.example.

version: 1

